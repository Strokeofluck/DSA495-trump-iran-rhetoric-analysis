name: Render animated gallery poster
on:
  push:
    paths:
      - 'scripts/render_gallery_video.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-video-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow imageio-ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render_gallery_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: animated-gallery-poster
          path: video-export/

      - name: Publish video and still image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gallery-video-130-posts >/dev/null 2>&1 || gh release create gallery-video-130-posts --title "Animated research poster — all 130 matched posts" --notes "Complete 130-post video and high-resolution poster still."
          gh release upload gallery-video-130-posts video-export/Trump_Iran_Animated_Poster_All_130_Posts.mp4 video-export/Trump_Iran_Poster_3600x3000.png video-export/render-checks.json --clobber
