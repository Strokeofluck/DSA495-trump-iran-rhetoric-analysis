name: Render animated gallery poster
on:
  push:
    paths:
      - 'scripts/render_gallery_video.py'
      - '.github/workflows/render-gallery-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-video-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow imageio-ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render_gallery_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: animated-gallery-poster
          path: video-export/

      - name: Publish video and still image
        run: |
          mkdir -p docs/media
          cp video-export/Trump_Iran_Animated_Poster_All_130_Posts.mp4 docs/media/
          cp video-export/Trump_Iran_Poster_3600x3000.png docs/media/
          cp video-export/render-checks.json docs/media/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/
          git commit -m "Publish complete 130-post gallery video and poster still" || true
          git push
